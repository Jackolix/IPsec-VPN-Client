[workspace]
resolver = "2"
members = [
    "crates/vpn-core",
    "crates/ncp-profile",
    "crates/sophos-profile",
    "crates/vici",
    "crates/vpn-control",
    "crates/vpn-agent",
    "crates/vpn-cli",
    "crates/vpn-desktop",
    "crates/vpn-broker",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
