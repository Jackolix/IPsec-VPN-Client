# strongswan.conf for the NATIVE Windows daemon (charon-svc.exe).
#
# Unlike the Linux backend container, the tunnel here terminates on the
# Windows host itself: charon uses the Windows Filtering Platform (kernel-wfp)
# to install IPsec SAs and IP Helper (kernel-iph) to manage addresses/routes,
# and socket-win for IKE UDP. The desktop app drives it over vici on loopback
# TCP, exactly as it drives the dev container, so the app's existing
# Transport::Tcp path works unchanged.
#
# SECURITY: a TCP vici socket is UNAUTHENTICATED. It is bound to 127.0.0.1
# only; never bind it to a routable address. The PSK is pushed in-memory via
# vici load-shared, never written to disk.

charon-svc {

    # vici listens on charon-svc's built-in Windows default, tcp://127.0.0.1:4502.
    # (The desktop app / vpn-agent target 127.0.0.1:4502 for the native backend;
    # the Linux dev container uses 45022 to avoid clashing when both are up.)

    # Windows has no /etc/resolv.conf; keep DNS handling to the app/OS.
    install_routes = yes
    install_virtual_ip = yes

    # Filelog so a connect transcript is available even outside the vici
    # `log` event stream. %APPDATA% is expanded by the service wrapper into an
    # absolute path before launch (charon does not expand env vars itself).
    filelog {
        charon {
            path = charon.log
            default = 1
            ike = 2
            knl = 1
            time_format = %b %e %T
            append = no
            flush_line = yes
        }
    }
}
