# strongswan.conf for the NATIVE Windows daemon (charon-svc.exe).
#
# Unlike the Linux backend container, the tunnel here terminates on the
# Windows host itself: charon does ESP in userland (kernel-libipsec) over a
# Wintun adapter, uses IP Helper (kernel-iph) to manage addresses/routes, and
# socket-win for IKE UDP. The desktop app drives it over vici on loopback TCP,
# exactly as it drives the dev container, so the app's existing Transport::Tcp
# path works unchanged.
#
# Windows' own IPsec engine (kernel-wfp) is deliberately not built: it drops
# UDP-encapsulated ESP, which is what a client behind NAT always sends.
#
# SECURITY: a TCP vici socket is UNAUTHENTICATED. It is bound to 127.0.0.1
# only; never bind it to a routable address. The PSK is pushed in-memory via
# vici load-shared, never written to disk.

charon-svc {

    # vici listens on a port dedicated to THIS app — deliberately not
    # charon-svc's built-in Windows default (tcp://127.0.0.1:4502).
    #
    # That default is baked into every strongSwan-based client, so on a machine
    # with another one installed (Sophos Connect ships a charon-svc and runs it
    # permanently) whichever daemon binds first owns the port. The app would then
    # find a listener there, conclude its backend was up, and drive a foreign
    # daemon — pushing connections and the PSK into it, and killing it on stop.
    #
    # Keep this in sync with NATIVE_VICI_ADDR (desktop) and VICI_ADDR (broker).
    # (The Linux dev container uses 45022.)
    plugins {
        vici {
            socket = tcp://127.0.0.1:45023
        }
    }

    # Send IKE from ephemeral source ports instead of the standard 500/4500.
    #
    # Windows' own IKEEXT service ("IKE and AuthIP IPsec Keying Modules") binds
    # UDP 500 and 4500 on every boot, so charon cannot own them: it appears to
    # send from :500, but the gateway's replies are delivered to IKEEXT and our
    # daemon just retransmits until it gives up. Using port 0 makes charon pick
    # random ports it can actually own; the peer then sees a non-500 source,
    # treats it as NAT, and the exchange proceeds UDP-encapsulated (which this
    # gateway does anyway). Other Windows strongSwan clients on this machine do
    # exactly the same thing.
    #
    # The alternative — disabling the IKEEXT service — is a system-wide change
    # we have no business making on a user's machine.
    port = 0
    port_nat_t = 0

    # Windows has no /etc/resolv.conf; keep DNS handling to the app/OS.
    install_routes = yes
    install_virtual_ip = yes

    # Filelog so a connect transcript is available even outside the vici
    # `log` event stream. %APPDATA% is expanded by the service wrapper into an
    # absolute path before launch (charon does not expand env vars itself).
    filelog {
        charon {
            path = charon.log
            default = 1
            ike = 2
            knl = 1
            time_format = %b %e %T
            append = no
            flush_line = yes
        }
    }
}
