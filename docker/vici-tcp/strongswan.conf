# strongSwan config for the dev "VPN backend" container.
#
# Exposes charon's vici control socket over TCP so a desktop app running on
# the Windows/macOS host can drive it. The desktop app pushes the connection
# and PSK over vici; nothing is configured here.
#
# SECURITY: a TCP vici socket is UNAUTHENTICATED. This is only acceptable
# because the container publishes the port to 127.0.0.1 on the host (see the
# run script's `-p 127.0.0.1:45022:45022`). Never expose it on a routable
# address.

charon {
    # Load standard plugins; override the vici transport to TCP.
    plugins {
        vici {
            socket = tcp://0.0.0.0:45022
        }
    }

    # Keep the daemon in the foreground-friendly default; container runs it.
    install_routes = yes
}
