# strongswan.conf for the NATIVE macOS daemon (charon).
#
# The tunnel terminates on the Mac itself: charon does ESP in userland
# (kernel-libipsec) over a utun device, uses PF_ROUTE (kernel-pfroute) to manage
# addresses and routes, and socket-default for IKE UDP. This is the same
# datapath shape as the Windows build, minus the Wintun problem — Darwin has
# utun in the kernel, and strongSwan's tun_device drives it directly, so the
# three Wintun patches the Windows build carries have no counterpart here.
#
# macOS' own IPsec stack (kernel-pfkey, the KAME/PF_KEY backend) is deliberately
# not built, for the same reason kernel-wfp is not built on Windows: its
# UDP-encapsulated ESP support in tunnel mode is incomplete, and behind NAT that
# encapsulation is not optional. Userland ESP over a virtual interface is the
# only datapath that reliably carries a road-warrior tunnel on both platforms.
#
# charon cannot locate this file once the dist tree is relocated out of its
# build prefix, so it is passed via STRONGSWAN_CONF (exactly as on Windows).

charon {

    # WHO MAY DRIVE THE DAEMON.
    #
    # charon does not leave its vici socket's ownership to the filesystem: it
    # chown()s the socket to its own configured uid/gid right after bind()
    # (libstrongswan/networking/streams/stream_service_unix.c). So the group of
    # the containing directory is irrelevant to the socket — BSD group
    # inheritance is overridden — and the only way to widen access is this
    # setting, which is the same value the chown() uses.
    #
    # Left at the default the socket lands as root:wheel 0770 and nothing but
    # root can drive charon, so the unprivileged GUI fails every vici call with
    # EACCES while the daemon runs perfectly well behind it.
    #
    # `user` is deliberately NOT set: charon must keep euid 0 to open a utun,
    # install the virtual IP and manage routes. Dropping only the group costs it
    # no privilege.
    #
    # staff is every local user. Narrow this to `admin` if the VPN should be
    # administrators-only — but note that a standard user then cannot use the
    # app at all. Either way this is a stopgap: the privileged helper is what
    # should eventually own this socket and authenticate its peer by code
    # signature, letting this go back to root-only.
    group = staff

    # vici listens on a Unix socket in a directory dedicated to THIS app —
    # deliberately not strongSwan's built-in default (/var/run/charon.vici).
    #
    # Same reasoning as NATIVE_VICI_ADDR on Windows: the default path is baked
    # into every strongSwan-based client, so on a machine that has another one
    # installed whichever daemon starts first owns it. The app would then find a
    # socket there, conclude its backend was up, and drive a foreign daemon —
    # pushing connections and the PSK into it, and killing it on stop.
    #
    # A Unix socket (not the loopback TCP socket the Windows build uses) because
    # on macOS the filesystem is the access control: the socket is root-owned,
    # so an unprivileged process cannot drive charon. That is a real improvement
    # over the unauthenticated TCP vici socket — and it is why the GUI needs the
    # privileged helper to reach it. Keep in sync with NATIVE_VICI_SOCKET.
    plugins {
        vici {
            socket = unix:///var/run/ipsec-vpn/charon.vici
        }
        # Capture the DNS servers the gateway pushes over mode config. Without a
        # handler charon discards INTERNAL_IP4_DNS ("handling ... attribute
        # failed"); the resolve plugin instead writes them here as `nameserver`
        # lines, and the app reads this file and applies them itself.
        #
        # This is a capture channel ONLY — it must not be /etc/resolv.conf.
        # macOS does not consult resolv.conf for its own resolution (mDNSResponder
        # reads the SystemConfiguration dynamic store and /etc/resolver/*), so
        # writing it would change nothing; and pointing the plugin at the real
        # file would let charon clobber a system file it cannot cleanly revert.
        #
        # For the same reason the `osx-attr` plugin — which applies pushed DNS
        # via SystemConfiguration itself — is deliberately NOT built: the app
        # applies DNS, so that it can revert exactly what it applied.
        resolve {
            file = /var/run/ipsec-vpn/resolv.conf
        }
    }

    install_routes = yes
    install_virtual_ip = yes

    # Unlike Windows (where IKEEXT permanently owns UDP 500/4500 and forces
    # charon onto ephemeral ports), nothing holds those ports on an idle Mac, so
    # the standard ports are used. If macOS' own VPN stack is connected at the
    # same time it will hold them and charon will fail to bind — set
    # `port = 0` / `port_nat_t = 0` here if that turns out to matter in practice.

    filelog {
        charon {
            path = /var/run/ipsec-vpn/charon.log
            default = 1
            ike = 2
            # knl at 2 so route and address installation is logged. strongSwan
            # logs "installing route: ..." at DBG2, so level 1 hides exactly the
            # lines you need when a tunnel routes more or less than its traffic
            # selectors say it should.
            knl = 2
            # Matches the Windows daemon's format. Not for the same reason —
            # that one had to move off %e because msvcrt's strftime has no such
            # specifier and returned nothing at all, while BSD strftime here
            # handles it fine — but a support report should not need to know
            # which platform it came from to be read, and this sorts.
            time_format = %Y-%m-%d %H:%M:%S
            append = no
            flush_line = yes
        }
    }
}
