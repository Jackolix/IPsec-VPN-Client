name: release

# Build all shippable Windows binaries on a version tag (e.g. v0.1.0) and
# attach them to a GitHub Release. The native strongSwan daemon must be
# cross-built on Linux (Docker + MinGW), so it is produced in a separate job
# and handed to the Windows job, which bundles it into the desktop installer.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # allow manual runs (no release is created then)

permissions:
  contents: write          # needed to create the Release and upload assets

jobs:
  # ---- 1. cross-build charon-svc.exe + DLLs on Linux -------------------------
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The daemon is a pure function of docker/strongswan-windows/** (the
      # Dockerfile pins every version it downloads), and that directory changes
      # about once a release cycle — while the cross-build inside it (OpenSSL +
      # strongSwan, from source, under MinGW) costs the better part of fifteen
      # minutes on every run. So key a cache on those inputs and skip the build
      # entirely when nothing there moved. A miss just rebuilds as before.
      - name: Cache the cross-built daemon
        id: daemon-cache
        uses: actions/cache@v4
        with:
          path: out/strongswan-windows
          key: strongswan-windows-${{ hashFiles('docker/strongswan-windows/**') }}

      - name: Cross-build strongSwan for Windows (MinGW)
        if: steps.daemon-cache.outputs.cache-hit != 'true'
        run: |
          docker build -t ss-win -f docker/strongswan-windows/Dockerfile .
          cid=$(docker create ss-win)
          mkdir -p out/strongswan-windows
          docker cp "$cid:/dist/." out/strongswan-windows/
          docker rm "$cid"
          echo "== exported artifacts =="
          ls -la out/strongswan-windows

      - uses: actions/upload-artifact@v4
        with:
          name: strongswan-windows
          path: out/strongswan-windows
          if-no-files-found: error

  # ---- 2. build the Rust CLIs + the desktop installer on Windows -------------
  windows:
    needs: daemon
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # tauri.conf.json's "version" is a static string that cargo tauri build
      # stamps into the installer filename/metadata - it does NOT follow the
      # pushed git tag on its own. Sync it here so "git tag v0.1.3" actually
      # produces "..._0.1.3_..." installers instead of drifting from the tag.
      - name: Sync app version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ver = $env:TAG -replace '^v', ''
          $path = 'crates/vpn-desktop/tauri.conf.json'
          (Get-Content $path -Raw) -replace '"version":\s*"[^"]+"', "`"version`": `"$ver`"" |
            Set-Content $path
          Write-Host "tauri.conf.json version -> $ver"
          Select-String -Path $path -Pattern '"version"'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Pull the daemon artifacts into the location the Tauri bundler and the
      # app's dev fallback both expect.
      - uses: actions/download-artifact@v4
        with:
          name: strongswan-windows
          path: out/strongswan-windows

      # Every one of these is load-bearing and fails in a way that is hard to
      # read at runtime: no wintun.dll => no TUN device => no datapath; no
      # libipsec-0.dll => charon won't even start; no etc\strongswan.conf =>
      # charon comes up on its built-in default vici port (shared with every
      # other strongSwan client) instead of ours, and the app won't find it.
      - name: Sanity-check the daemon artifacts are present
        shell: pwsh
        run: |
          Get-ChildItem -Recurse out\strongswan-windows
          $required = @(
            'charon-svc.exe', 'wintun.dll', 'libipsec-0.dll',
            'libstrongswan-0.dll', 'libcharon-0.dll', 'etc\strongswan.conf'
          )
          $missing = $required | Where-Object { -not (Test-Path "out\strongswan-windows\$_") }
          if ($missing) { throw "daemon artifacts missing: $($missing -join ', ')" }

      # Vendor OpenVPN for the SSL VPN datapath into out\openvpn (openvpn.exe +
      # tapctl + DLLs + the legacy provider), reusing the strongSwan build's
      # wintun.dll. Bundled beside the broker as openvpn\ (see
      # tauri.windows.conf.json). Must run before any build of vpn-desktop,
      # whose build.rs validates the "../../out/openvpn/*" resource glob resolves
      # — so before the broker build, the tests, and the tauri build below.
      - name: Vendor the bundled OpenVPN
        shell: pwsh
        run: |
          .\scripts\fetch-openvpn-windows.ps1
          Get-ChildItem -Recurse out\openvpn

      # vpn-desktop's build.rs (tauri_build::build()) validates that the
      # "../../out/broker/*" resource glob in tauri.windows.conf.json
      # resolves to real files, so out/broker must exist before *any* build
      # of the workspace (including `cargo test`) touches that crate.
      - name: Build + stage the privileged broker service
        shell: pwsh
        run: |
          cargo build --release -p vpn-broker
          New-Item -ItemType Directory -Force out\broker | Out-Null
          Copy-Item target\release\vpn-broker.exe out\broker\ -Force
          Get-ChildItem out\broker

      - name: Run tests
        run: cargo test --workspace --release

      - name: Build CLI binaries
        run: cargo build --release -p vpn-agent -p vpn-cli

      # `cargo install tauri-cli` compiles the CLI from source — minutes of work
      # to produce a binary the Tauri project already publishes for this exact
      # target. binstall downloads that instead (tauri-cli carries the
      # [package.metadata.binstall] to point at it). Falls back to building it
      # if the download is ever unavailable, so this can't wedge a release.
      - uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        shell: bash
        run: |
          cargo binstall --no-confirm --locked 'tauri-cli@^2.0' \
            || cargo install tauri-cli --version "^2.0" --locked
          cargo tauri --version

      # The bundle carries "createUpdaterArtifacts", so the build signs the
      # installer with the key whose public half is pinned in tauri.conf.json —
      # and fails outright without it. Say which secret is missing here rather
      # than letting `cargo tauri build` fail deep in its own output.
      - name: Check the updater signing key is configured
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not set — the installer cannot be signed for the updater. See README, 'Updating the app'."
          }

      - name: Build desktop app + installer (bundles charon-svc)
        working-directory: crates/vpn-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build

      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-assets | Out-Null
          Copy-Item target\release\vpn-agent.exe  dist-assets\ -ErrorAction SilentlyContinue
          Copy-Item target\release\vpn-cli.exe    dist-assets\ -ErrorAction SilentlyContinue
          Copy-Item target\release\vpn-broker.exe dist-assets\ -ErrorAction SilentlyContinue
          # The bundles are named after the product ("VPN Client_0.2.3_..."), and
          # GitHub rewrites the space when it stores a release asset — so the
          # download URL would not be the one we asked for, while latest.json has
          # to name it byte for byte. Publish them space-free instead of guessing
          # at the rewrite.
          Get-ChildItem -Recurse target\release\bundle -Include *.exe,*.msi,*.sig |
            ForEach-Object { Copy-Item $_.FullName (Join-Path dist-assets ($_.Name -replace ' ', '-')) }
          Write-Host "== assets =="
          Get-ChildItem dist-assets

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist-assets/*

  # ---- 3. build the macOS app on Apple Silicon -------------------------------
  # arm64 only, deliberately — see the note at the top of
  # scripts/build-strongswan-macos.sh. macos-14 is the Apple Silicon runner.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Sync app version from tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          perl -pi -e 's/"version":\s*"[^"]+"/"version": "'"$ver"'"/' \
            crates/vpn-desktop/tauri.conf.json
          grep '"version"' crates/vpn-desktop/tauri.conf.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Both daemons are a pure function of their build scripts (which pin every
      # version they download), and building OpenSSL + strongSwan + OpenVPN from
      # source costs upwards of fifteen minutes. Cache on the script contents so
      # a release that did not touch them skips the whole thing.
      - name: Cache the native daemons
        id: macos-daemons
        uses: actions/cache@v4
        with:
          path: |
            out/strongswan-macos
            out/openvpn-macos
          key: macos-daemons-${{ hashFiles('scripts/build-strongswan-macos.sh', 'scripts/build-openvpn-macos.sh', 'macos/strongswan.conf') }}

      - name: Build strongSwan and OpenVPN
        if: steps.macos-daemons.outputs.cache-hit != 'true'
        run: |
          ./scripts/build-strongswan-macos.sh
          # Reuse the OpenSSL the strongSwan build just produced rather than
          # building a second identical copy.
          OPENSSL_PREFIX="$PWD/build/strongswan-macos/arm64/prefix" \
            ./scripts/build-openvpn-macos.sh

      # Both scripts verify their own output, but a cache hit restores a tree
      # nothing has checked this run. These are the files whose absence fails
      # at runtime rather than at build time.
      - name: Sanity-check the daemon artifacts are present
        run: |
          required="
            out/strongswan-macos/charon
            out/strongswan-macos/libstrongswan.0.dylib
            out/strongswan-macos/libcharon.0.dylib
            out/strongswan-macos/libipsec.0.dylib
            out/strongswan-macos/etc/strongswan.conf
            out/openvpn-macos/openvpn
          "
          missing=""
          for f in $required; do [ -f "$f" ] || missing="$missing $f"; done
          if [ -n "$missing" ]; then echo "missing:$missing" >&2; exit 1; fi
          ls -la out/strongswan-macos out/openvpn-macos

      # vpn-desktop's build.rs runs tauri_build::build(), which validates that
      # every resource glob in tauri.macos.conf.json resolves — so out/helper
      # must exist before ANY build of that crate, tests included.
      - name: Build + stage the privileged helper
        run: |
          cargo build --release -p vpn-broker
          mkdir -p out/helper
          cp target/release/vpn-broker out/helper/
          ls -la out/helper

      - name: Run tests
        run: cargo test --workspace --release

      - name: Build CLI binaries
        run: cargo build --release -p vpn-agent -p vpn-cli

      - uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: |
          cargo binstall --no-confirm --locked 'tauri-cli@^2.0' \
            || cargo install tauri-cli --version "^2.0" --locked
          cargo tauri --version

      - name: Check the signing secrets are configured
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          [ -n "$KEY" ] || { echo "TAURI_SIGNING_PRIVATE_KEY is not set — the bundle cannot be signed for the updater. See README, 'Updating the app'." >&2; exit 1; }
          # Gatekeeper blocks an unsigned app on any machine but the one that
          # built it, so a release without a Developer ID is not shippable.
          [ -n "$CERT" ] || { echo "APPLE_CERTIFICATE is not set — the app would not pass Gatekeeper on any other Mac." >&2; exit 1; }

      # Notarisation staples the whole bundle, and every Mach-O inside it has to
      # carry the same Developer ID signature with the hardened runtime. Tauri
      # signs the .app it builds, but charon, openvpn, the helper and their
      # dylibs are plain `resources` that it copies in as-is — they still carry
      # the ad-hoc signature the build scripts gave them. Re-sign them here,
      # before the bundle is assembled, or notarisation rejects the lot.
      - name: Sign the bundled daemons with the Developer ID
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # Import the cert into a throwaway keychain scoped to this runner.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS="$(uuidgen)"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASS" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          for f in out/strongswan-macos/* out/openvpn-macos/* out/helper/*; do
            [ -f "$f" ] || continue
            case "$f" in *.conf) continue ;; esac
            codesign --force --timestamp --options runtime \
              --sign "$APPLE_SIGNING_IDENTITY" "$f"
            codesign --verify --strict "$f"
          done
          echo "== signed =="
          ls -la out/strongswan-macos out/openvpn-macos out/helper

      # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID together are what make Tauri
      # notarise; without them it signs but does not submit, and Gatekeeper
      # still shows the "unidentified developer" prompt on first launch.
      - name: Build the app bundle (signed + notarised)
        working-directory: crates/vpn-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo tauri build --target aarch64-apple-darwin

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p dist-assets
          for b in vpn-agent vpn-cli vpn-broker; do
            src="target/aarch64-apple-darwin/release/$b"
            [ -f "$src" ] && cp "$src" "dist-assets/$b-macos-arm64"
          done
          # GitHub rewrites the space in "VPN Client_x.y.z_..." when it stores an
          # asset, so the download URL would not be the one we asked for — while
          # latest.json has to name it byte for byte. Publish them space-free.
          find target/aarch64-apple-darwin/release/bundle \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) \
            -exec sh -c 'cp "$1" "dist-assets/$(basename "$1" | tr " " "-")"' _ {} \;
          echo "== assets =="
          ls -la dist-assets

      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist-assets/*
          if-no-files-found: error

  # ---- 4. compose the updater manifest and publish ---------------------------
  # Neither build job can own latest.json: it names an artifact from each, and
  # whichever wrote it would clobber the other's entry. So it is assembled here,
  # once, from what both uploaded.
  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist-assets

      - uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: dist-assets

      # What the running app polls: the version on offer, and the signature it
      # must verify before executing what the URL points at. Published as a
      # release asset so "releases/latest/download/latest.json" — the endpoint
      # pinned in tauri.conf.json — always resolves to the newest one.
      - name: Build the updater manifest (latest.json)
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          cd dist-assets

          pick() { # glob -> exactly one matching filename, or fail loudly
            local matches; matches=$(ls -1 $1 2>/dev/null || true)
            local n; n=$(printf '%s' "$matches" | grep -c . || true)
            if [ "$n" != "1" ]; then
              echo "expected exactly one $1, found $n" >&2; exit 1
            fi
            printf '%s' "$matches"
          }

          # The MSI is bundled too, but the NSIS installer is the one carrying
          # the broker service hooks, so it is what an update runs. macOS
          # updates consume the .app.tar.gz — never the .dmg.
          win=$(pick "*_${ver}_*-setup.exe")
          mac=$(pick "*_${ver}_*.app.tar.gz")
          [ -f "$win.sig" ] || { echo "no signature beside $win" >&2; exit 1; }
          [ -f "$mac.sig" ] || { echo "no signature beside $mac" >&2; exit 1; }

          base="https://github.com/$REPO/releases/download/$TAG"
          cat > latest.json <<EOF
          {
            "version": "$ver",
            "notes": "See the release notes for $TAG.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$(cat "$win.sig")",
                "url": "$base/$win"
              },
              "darwin-aarch64": {
                "signature": "$(cat "$mac.sig")",
                "url": "$base/$mac"
              }
            }
          }
          EOF
          # A malformed manifest is silently ignored by the updater, which
          # presents as "updates stopped working" months later.
          python3 -m json.tool latest.json
          ls -la

      - name: Publish Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
