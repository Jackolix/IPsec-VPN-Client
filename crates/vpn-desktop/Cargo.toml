[package]
name = "vpn-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tauri desktop GUI for the VPN client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vpn-core = { path = "../vpn-core" }
ncp-profile = { path = "../ncp-profile" }
sophos-profile = { path = "../sophos-profile" }
vpn-control = { path = "../vpn-control" }
vpn-broker = { path = "../vpn-broker" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = "1"
# Portal client for downloading a profile a .pro provisioning file points at.
# blocking: called from the backend's spawn_blocking threads; cookies: the
# portal's session rides a cookie across login → CSRF → download; default-tls:
# SChannel on Windows (no extra crypto toolchain) — the self-signed appliance
# cert is accepted explicitly rather than via a trust store.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "cookies", "json", "default-tls"] }
# `itmvpn://` deep links, so the config-download website can hand a profile
# straight to the client. The single-instance plugin's `deep-link` feature is
# what forwards the URL from the second launch into the running instance.
tauri-plugin-deep-link = "2"
# Decoding the profile a deep link carries inline, and parsing the link itself.
base64 = "0.22"
url = "2"

# OS keychain for the PSK, using each platform's native credential store
# (Windows Credential Manager, macOS Keychain, Secret Service on Linux).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# IcmpSendEcho, for the host reachability check (`reach`). It does the echo in
# the kernel on the caller's behalf, so the unelevated GUI can probe without a
# raw socket and without going through the privileged helper.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# The unprivileged ICMP datagram socket behind the host reachability check.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
libc = "0.2"

[features]
# Prevents a console window from also opening on Windows release builds.
default = []
