[package]
name = "vpn-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tauri desktop GUI for the IPsec VPN client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vpn-core = { path = "../vpn-core" }
ncp-profile = { path = "../ncp-profile" }
vpn-control = { path = "../vpn-control" }
vpn-broker = { path = "../vpn-broker" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = "1"

# OS keychain for the PSK, using each platform's native credential store
# (Windows Credential Manager, macOS Keychain, Secret Service on Linux).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[features]
# Prevents a console window from also opening on Windows release builds.
default = []
