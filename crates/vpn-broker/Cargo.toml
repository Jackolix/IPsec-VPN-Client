[package]
name = "vpn-broker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Privileged LocalSystem helper service: supervises charon-svc and applies DNS for the unelevated GUI"

# lib = shared IPC protocol + a client the GUI links against.
# bin = the Windows service itself.
[lib]
name = "vpn_broker"
path = "src/lib.rs"

[[bin]]
name = "vpn-broker"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# The macOS helper needs LOCAL_PEERCRED to identify who is on the other end of
# its Unix socket; there is no std API for that.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# The service, named-pipe IPC and SCM install/uninstall are Windows-only.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Memory",
    "Win32_System_IO",
    # Identify who owns the vici port (GetExtendedTcpTable) and what binary it
    # is (QueryFullProcessImageNameW) — see `listener`.
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
] }
